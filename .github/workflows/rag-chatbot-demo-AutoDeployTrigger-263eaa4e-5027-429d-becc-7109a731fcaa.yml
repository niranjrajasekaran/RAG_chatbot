name: Trigger auto deployment for rag-chatbot-demo

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/rag-chatbot-demo-AutoDeployTrigger-263eaa4e-5027-429d-becc-7109a731fcaa.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.RAGCHATBOTDEMO_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.RAGCHATBOTDEMO_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.RAGCHATBOTDEMO_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: ${{ secrets.RAGCHATBOTDEMO_LOGIN_SERVER }}
          registryUsername: ${{ secrets.RAGCHATBOTDEMO_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.RAGCHATBOTDEMO_REGISTRY_PASSWORD }}
          containerAppName: rag-chatbot-demo
          resourceGroup: rg-rag-poc
          imageToBuild: ${{ secrets.RAGCHATBOTDEMO_REGISTRY_URL }}/rag-chatbot-demo:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_




